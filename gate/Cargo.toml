[package]
name = "gate"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cityflight = { path = "../flight", default-features = false, features = ["jsb"] }

[profile.release]
opt-level = 3
debug = false

[[bin]]
name = "gatecheck"
path = "src/bin/gatecheck.rs"
