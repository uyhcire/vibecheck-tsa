[package]
name = "cityflight"
version = "0.1.0"
edition = "2021"
default-run = "cityflight"

[features]
default = ["gui"]
gui = ["dep:macroquad"]

[dependencies]
macroquad = { version = "0.4", optional = true, default-features = false }

[[bin]]
name = "cityflight"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "harness"
path = "src/bin/harness.rs"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 2
