[package]
name = "cityflight"
version = "0.1.0"
edition = "2021"
default-run = "cityflight"

[features]
default = ["gui"]
gui = ["dep:macroquad", "dep:image"]
jsb = []

[dependencies]
macroquad = { version = "0.4", optional = true, default-features = false }
image = { version = "0.24", optional = true, default-features = false, features = ["jpeg"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc = { package = "objc-rs", version = "0.2" }

[[bin]]
name = "cityflight"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "harness"
path = "src/bin/harness.rs"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 2

[[bin]]
name = "jsbtune"
path = "src/bin/jsbtune.rs"
required-features = ["jsb"]

[[bin]]
name = "crashes"
path = "src/bin/crashes.rs"
required-features = ["jsb"]

[[bin]]
name = "adversary"
path = "src/bin/adversary.rs"
required-features = ["jsb"]

[[bin]]
name = "esclab"
path = "src/bin/esclab.rs"
required-features = ["jsb"]

[[bin]]
name = "drawstep"
path = "src/bin/drawstep.rs"
required-features = ["jsb"]

[[bin]]
name = "proofdump"
path = "src/bin/proofdump.rs"
required-features = ["jsb"]

# miniquad 0.4.11 with its Metal backend completed (render-target formats, MSAA resolve,
# 32-bit indices, capture, raw handles); diff against the crates.io 0.4.11 source.
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }

[[bin]]
name = "regimes"
path = "src/bin/regimes.rs"
required-features = ["jsb"]

[[bin]]
name = "termhunt"
path = "src/bin/termhunt.rs"
required-features = ["jsb"]

[[bin]]
name = "gatefaith"
path = "src/bin/gatefaith.rs"
required-features = ["jsb"]
