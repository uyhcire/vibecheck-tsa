name = "exp_continuous_pilot"
defaultTargets = ["ExpJsb", "ExpProofs"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "ExpVibecheck"

[[lean_lib]]
name = "ExpJsb"
globs = ["ExpJsb.+"]

[[lean_lib]]
name = "ExpProofs"
globs = ["ExpProofs.+"]
